name: Android
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'src/**', 'package*.json', 'config.example.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'package*.json', 'config.example.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes patchelf
      - run: npm ci
      - run: python3 android/tools/prepare.py
      - run: chmod +x android/gradlew && android/gradlew -p android testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fishingbot-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
